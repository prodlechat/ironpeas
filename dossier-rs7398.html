<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon dossier RS7398 · Muziforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --navy:#191970; --navy2:#2b2b8a; --ink:#1d1d27; --muted:#5a5a6e; --line:#d6d6e6; --soft:#f4f4fa; --ok:#1a7f45; --warn:#b7791f; --bad:#b0203a; --gold:#f0b429; }
* { box-sizing:border-box; }
body { margin:0; font-family:Inter, system-ui, sans-serif; color:var(--ink); background:#f7f7fb; font-size:14px; line-height:1.45; }
header.top { background:var(--navy); color:#fff; padding:18px 24px; }
header.top h1 { margin:0; font-size:20px; }
header.top p { margin:4px 0 0; opacity:.85; font-size:13px; }
.wrap { display:grid; grid-template-columns: 270px 1fr; gap:20px; max-width:1280px; margin:0 auto; padding:20px; }
aside { position:sticky; top:12px; align-self:start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; max-height:calc(100vh - 24px); overflow:auto; }
aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 8px; }
.navitem { display:block; padding:7px 8px; border-radius:8px; color:var(--ink); text-decoration:none; cursor:pointer; margin-bottom:2px; border:0; background:none; width:100%; text-align:left; font:inherit; }
.navitem:hover, .navitem.on { background:var(--soft); }
.navitem .st { float:right; font-size:12px; font-weight:700; }
.checks { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.chk { font-size:12px; margin:3px 0; display:flex; gap:6px; }
.chk .i { width:16px; flex:none; font-weight:800; }
.chk.ok .i { color:var(--ok); } .chk.no .i { color:var(--bad); }
.chk .c { color:var(--muted); }
.chk.ok .c { color:var(--ink); }
.btns { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
button.b { font:inherit; font-weight:600; border-radius:8px; border:1px solid var(--navy); padding:9px 12px; cursor:pointer; background:#fff; color:var(--navy); }
button.b.primary { background:var(--navy); color:#fff; }
button.b.small { padding:5px 9px; font-size:12px; }
button.b.danger { border-color:var(--bad); color:var(--bad); }
main { min-width:0; }
.panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:18px; }
.panel h2 { margin:0 0 4px; color:var(--navy); font-size:19px; }
.panel .crit { font-size:12.5px; color:var(--muted); border-left:3px solid var(--gold); background:#fff8e6; padding:6px 10px; margin:6px 0 14px; border-radius:0 6px 6px 0; }
.panel h3 { font-size:14px; color:var(--navy2); margin:18px 0 6px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
label.f { display:block; font-size:12.5px; font-weight:600; margin-bottom:10px; }
label.f .h { display:block; font-weight:400; color:var(--muted); font-size:11.5px; margin:1px 0 3px; }
input[type=text], textarea, select { width:100%; font:inherit; font-size:13.5px; padding:7px 9px; border:1px solid #c9c9dc; border-radius:7px; background:#fff; color:var(--ink); }
textarea { min-height:62px; resize:vertical; }
input:focus, textarea:focus, select:focus { outline:2px solid #9ea8ff; border-color:var(--navy); }
.row { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fcfcff; position:relative; }
.row .rh { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; color:var(--navy); font-size:13px; }
.listhead { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.count { font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; }
.count.ok { background:#e5f5ec; color:var(--ok); } .count.no { background:#fdecef; color:var(--bad); }
.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:50; max-width:90vw; }
.toast.on { opacity:1; }
.info { background:#eef0ff; border:1px solid #c9cdf5; border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:18px; }
.modal { position:fixed; inset:0; background:rgba(20,20,40,.45); display:none; align-items:center; justify-content:center; z-index:60; }
.modal.on { display:flex; }
.modal .box { background:#fff; border-radius:12px; padding:20px; max-width:480px; width:92vw; }
.modal .box h3 { margin:0 0 8px; color:var(--navy); }
.modal .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
#previewWrap { display:none; }
#previewWrap.on { display:block; }
.prevbar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.prevbar .sp { flex:1; }
.missing { background:#fdecef; border:1px solid #f2b8c3; border-radius:10px; padding:10px 14px; margin:12px auto; max-width:1100px; font-size:13px; }
.missing ul { margin:4px 0 0 18px; padding:0; }
.docscroll { overflow:auto; padding:16px; }
@media (max-width:900px){ .wrap{grid-template-columns:1fr;} aside{position:static; max-height:none;} .grid2,.grid3{grid-template-columns:1fr;} }

/* ======= DOSSIER (rendu) ======= */
.doc { width:1047px; margin:0 auto; font-size:12.2px; line-height:1.42; color:var(--ink); }
.doc .pg { background:#fff; padding:26px 30px; margin:0 0 16px; border:1px solid var(--line); min-height:700px; page-break-after:always; break-after:page; }
.doc .pg:last-child { page-break-after:auto; break-after:auto; }
.doc h1 { font-size:36px; color:var(--navy); line-height:1.1; margin:0 0 8px; }
.doc h2 { font-size:21px; color:var(--navy); margin:0 0 4px; }
.doc h2 .num { display:inline-block; background:var(--navy); color:#fff; border-radius:7px; padding:0 10px; margin-right:9px; }
.doc h3 { font-size:14px; color:var(--navy2); margin:14px 0 5px; }
.doc .crit { font-size:10.5px; color:var(--muted); border-left:3px solid var(--gold); background:#fff8e6; padding:4px 9px; margin:4px 0 12px; }
.doc table { width:100%; border-collapse:collapse; margin:4px 0 10px; font-size:11.3px; }
.doc th { background:#e9e9f7; color:var(--navy); text-align:left; padding:6px 7px; border:1px solid #c9c9e0; font-weight:700; vertical-align:top; }
.doc td { padding:6px 7px; border:1px solid var(--line); vertical-align:top; white-space:pre-wrap; }
.doc tr { page-break-inside:avoid; break-inside:avoid; }
.doc .cols { display:flex; gap:14px; }
.doc .cols > div { flex:1; }
.doc .card { border:1px solid var(--line); border-radius:9px; padding:10px 12px; page-break-inside:avoid; break-inside:avoid; }
.doc .card h4 { margin:0 0 5px; color:var(--navy); font-size:13px; }
.doc .kv { margin:2px 0; white-space:pre-wrap; }
.doc .kv b { color:var(--navy2); }
.doc .choice { background:#e8f6ee; border:1px solid #9bd3b2; border-radius:8px; padding:10px 12px; margin:10px 0; white-space:pre-wrap; page-break-inside:avoid; break-inside:avoid; }
.doc .blank { color:#9a9ab0; font-style:italic; }
.doc .line { display:block; border-bottom:1px dotted #9a9ab0; min-height:18px; margin:3px 0; }
.doc .tag { display:inline-block; background:var(--navy); color:#fff; font-weight:700; padding:4px 10px; border-radius:4px; font-size:11px; margin-bottom:14px; }
.doc .cover { display:flex; flex-direction:column; justify-content:center; min-height:640px; }
.doc .org { display:flex; flex-wrap:wrap; gap:8px; }
.doc .org .card { flex:1 1 30%; min-width:30%; }

body.printmode { background:#fff; }
body.printmode header.top, body.printmode .wrap, body.printmode .prevbar, body.printmode .missing { display:none !important; }
body.printmode #previewWrap { display:block; }
body.printmode .docscroll { padding:0; overflow:visible; }
body.printmode .doc { width:auto; }
body.printmode .doc .pg { border:0; margin:0; padding:0; min-height:0; }
@page { size:A4 landscape; margin:14mm 16mm; }
</style>
</head>
<body>
<header class="top">
  <h1>Mon dossier de projet professionnel · Certification RS7398</h1>
  <p>« Structurer et développer une activité artistique musicale » · Trame de préparation Muziforma</p>
</header>

<div class="wrap" id="formView">
  <aside>
    <h2>Parties</h2>
    <div id="nav"></div>
    <div class="checks"><h2>Exigences du référentiel</h2><div id="checks"></div></div>
    <div class="btns">
      <button class="b primary" id="btnValider">Valider et générer mon dossier</button>
      <button class="b" id="btnExport">Sauvegarder mes réponses (fichier)</button>
      <button class="b" id="btnImport">Reprendre une sauvegarde</button>
      <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
      <button class="b danger small" id="btnReset">Tout effacer</button>
    </div>
    <p style="font-size:11px;color:#5a5a6e;margin:10px 0 0;" id="saveState">Vos réponses restent dans ce navigateur, sur cet appareil.</p>
  </aside>
  <main id="form"></main>
</div>

<div id="previewWrap">
  <div class="prevbar">
    <button class="b" id="btnBack">← Revenir au formulaire</button>
    <span class="sp"></span>
    <button class="b primary" id="btnPdf">Télécharger le PDF</button>
    <button class="b" id="btnHtml">Télécharger en HTML</button>
  </div>
  <div id="missing"></div>
  <div class="docscroll"><div class="doc" id="doc"></div></div>
</div>

<div class="modal" id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="acts" id="mActs"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== SCHÉMA ================== */
const NATURES = ["Durée","Cession de droits","Exclusivité","Rémunération","Autre"];
const ROLES = ["Facturation","Trésorerie","Droits d'auteur","Droits voisins","Catalogue et contrats","Autre"];
const DOMAINES = ["Artistique","Technologique","Réglementaire","Artistique et réglementaire","Technologique et réglementaire","Artistique et technologique","Business"];
const SIGNAUX = ["Signal faible","Opportunité"];
const OBJ_TYPES = ["Notoriété","Streaming","Engagement","Billetterie","Ventes (CD, vinyles)","Merchandising","Fidélisation","Autre"];

const LISTS = {
  objPro:   { min:1, label:"Objectif professionnel", fields:[
    {k:"horizon",l:"Horizon",h:"Ex. : date ou période"},
    {k:"objectif",l:"Objectif",t:"ta",h:"Ce que vous voulez atteindre, concrètement"},
    {k:"lien",l:"Lien avec le dossier",h:"Quelle partie du dossier y répond ?"} ]},
  formes:   { min:2, label:"Forme juridique", fields:[
    {k:"nom",l:"Forme juridique",h:"EI, micro-entreprise, association, société (SAS, SASU, SARL...)"},
    {k:"revenus",l:"Revenus artistiques",t:"ta",h:"Quels revenus peut-elle encaisser ? Que ne peut-elle pas facturer ?"},
    {k:"droits",l:"Gestion des droits d'auteur",t:"ta",h:"Comment s'articule-t-elle avec vos droits d'auteur et droits voisins ?"},
    {k:"oblig",l:"Obligations sociales et fiscales",t:"ta",h:"Cotisations, impôt, comptabilité, coûts fixes, formalités"} ]},
  statuts:  { min:2, label:"Statut professionnel", fields:[
    {k:"nom",l:"Statut",h:"Intermittent du spectacle, artiste-auteur, salarié, mandataire..."},
    {k:"revenus",l:"Revenus artistiques",t:"ta",h:"Quels revenus relèvent de ce statut ?"},
    {k:"droits",l:"Gestion des droits d'auteur",t:"ta",h:"Rôle de la SACEM, de l'Adami, de la Spedidam..."},
    {k:"oblig",l:"Obligations sociales et fiscales",t:"ta",h:"Cotisations, déclarations, protection sociale, imposition"} ]},
  clauses:  { min:4, label:"Clause sensible", fields:[
    {k:"nature",l:"Nature",t:"sel",o:NATURES},
    {k:"texte",l:"Ce que dit la clause",t:"ta",h:"Citez ou résumez l'article (avec son numéro)"},
    {k:"sensible",l:"Pourquoi elle est sensible",t:"ta",h:"Qu'est-ce qui pose problème pour l'artiste ?"},
    {k:"engagement",l:"Engagement associé",t:"ta",h:"À quoi vous engagez-vous en signant ?"},
    {k:"artistiques",l:"Risques sur les droits artistiques",t:"ta"},
    {k:"financiers",l:"Risques sur les droits financiers",t:"ta"},
    {k:"moraux",l:"Risques sur les droits moraux",t:"ta"} ]},
  ajust:    { min:2, label:"Ajustement", fields:[
    {k:"prop",l:"Proposition d'ajustement",t:"ta",h:"Quelle nouvelle rédaction proposez-vous ?"},
    {k:"justif",l:"Justification",t:"ta",h:"Quel intérêt artistique, financier ou moral cela protège-t-il ?"} ]},
  ressJur:  { min:2, label:"Ressource juridique", fields:[
    {k:"nom",l:"Nom de la ressource"},
    {k:"type",l:"Type",h:"Guide professionnel, modèle de contrat, avocat spécialisé, plateforme juridique, organisme..."},
    {k:"fiab",l:"Pourquoi elle est fiable",t:"ta"} ]},
  outils:   { min:3, label:"Outil", fields:[
    {k:"role",l:"Rôle",t:"sel",o:ROLES},
    {k:"nom",l:"Nom de l'outil"},
    {k:"usage",l:"À quoi il sert",t:"ta"},
    {k:"integ",l:"Comment je l'intègre dans mon projet",t:"ta",h:"Quand et comment vous l'utilisez, concrètement"} ]},
  process:  { min:2, label:"Processus", fields:[
    {k:"nom",l:"Nom du processus",h:"Ex. : gestion des droits d'une sortie, suivi des contrats, archivage..."},
    {k:"droits",l:"Concerne la gestion des droits ?",t:"sel",o:["Non","Oui"]},
    {k:"etapes",l:"Étapes",t:"ta",h:"Décrivez les étapes dans l'ordre"},
    {k:"freq",l:"Fréquence et outils"} ]},
  presta:   { min:3, label:"Prestataire", fields:[
    {k:"cat",l:"Catégorie",h:"Gestion des droits, juridique, comptable, distribution, production..."},
    {k:"nom",l:"Nom ou type de prestataire"},
    {k:"role",l:"Rôle dans mon activité",t:"ta"},
    {k:"legit",l:"Légitimité dans le secteur et obligations couvertes",t:"ta"} ]},
  bench:    { min:2, label:"Artiste du benchmark", fields:[
    {k:"artiste",l:"Artiste ou projet de référence"},
    {k:"canaux",l:"Canaux de communication",h:"Instagram, TikTok, YouTube, plateformes..."},
    {k:"formats",l:"Formats dominants",t:"ta"},
    {k:"posit",l:"Positionnement (image, ton, angle)",t:"ta"},
    {k:"retenu",l:"Ce que j'en retiens pour mon projet",t:"ta"} ]},
  objCom:   { min:1, label:"Objectif de communication", fields:[
    {k:"type",l:"Type d'objectif",t:"sel",o:OBJ_TYPES},
    {k:"cible",l:"Cible chiffrée"},
    {k:"horizon",l:"Horizon",h:"Ex. : 30 jours, 90 jours"} ]},
  personas: { min:2, label:"Persona", fields:[
    {k:"nom",l:"Prénom et surnom du persona"},
    {k:"age",l:"Âge"},
    {k:"csp",l:"Profil, CSP, métier"},
    {k:"lieu",l:"Lieu d'habitation"},
    {k:"loisirs",l:"Loisirs"},
    {k:"genre",l:"Genres musicaux écoutés"},
    {k:"plateformes",l:"Plateformes utilisées"},
    {k:"desc",l:"Habitudes et motivations",t:"ta"} ]},
  kpis:     { min:3, label:"Indicateur (KPI)", fields:[
    {k:"kpi",l:"Indicateur"},
    {k:"plateforme",l:"Plateforme et outil de mesure"},
    {k:"obj",l:"Objectif lié"},
    {k:"cible",l:"Valeur cible chiffrée"} ]},
  planning: { min:4, label:"Période du planning", fields:[
    {k:"periode",l:"Période",h:"Ex. : semaine 1, du ... au ..."},
    {k:"plateformes",l:"Plateformes"},
    {k:"actions",l:"Actions et formats",t:"ta",h:"Publications organiques, campagnes pub, formats"},
    {k:"obj",l:"Objectif",h:"Engagement, conversion, notoriété..."},
    {k:"budget",l:"Budget",h:"Mettre 0 € si organique"} ]},
  result:   { min:2, label:"Optimisation", fields:[
    {k:"res",l:"Résultat observé",t:"ta",h:"Chiffres issus de l'outil d'analyse"},
    {k:"optim",l:"Optimisation proposée",t:"ta",h:"Contenu, créneau, horaire, format, ciblage..."},
    {k:"justif",l:"Justification",t:"ta"} ]},
  contenus: { min:1, label:"Contenu", fields:[
    {k:"type",l:"Type de contenu",h:"Reel, vidéo, post, story..."},
    {k:"access",l:"Accessibilité intégrée",t:"ta",h:"Sous-titrage, audiodescription, police adaptée, pas d'effets lumineux agressifs..."},
    {k:"sobr",l:"Sobriété numérique",t:"ta",h:"Format compressé (.WebP, .AVIF), durée réduite, pas de lecture automatique..."},
    {k:"justif",l:"Justification (cible, plateforme, attractivité)",t:"ta"} ]},
  sources:  { min:4, label:"Source de veille", fields:[
    {k:"nom",l:"Source"},
    {k:"secteur",l:"Secteur couvert"},
    {k:"fiab",l:"Fiabilité (justification)",t:"ta"},
    {k:"dom",l:"Domaine",t:"sel",o:DOMAINES} ]},
  outVeille:{ min:1, label:"Outil de veille", fields:[
    {k:"outil",l:"Outil",h:"Google Alertes, agrégateur RSS, newsletters..."},
    {k:"param",l:"Paramétrage",t:"ta",h:"Mots-clés, fréquence, sources, langue, région..."},
    {k:"justif",l:"Justification du paramétrage",t:"ta"} ]},
  signaux:  { min:2, label:"Signal ou opportunité", fields:[
    {k:"type",l:"Type",t:"sel",o:SIGNAUX},
    {k:"element",l:"Élément repéré et source",t:"ta"},
    {k:"impact",l:"Impact sur mon positionnement",t:"ta"} ]}
};

const SECTIONS = [
 { id:"s-id", n:"", title:"Mes informations", crit:"Ces informations apparaissent sur la couverture de votre dossier.",
   blocks:[ {grid:3, fields:[{k:"id_nom",l:"Nom"},{k:"id_prenom",l:"Prénom"},{k:"id_scene",l:"Nom de scène ou du projet"}]},
            {grid:2, fields:[{k:"id_role",l:"Je présente le projet en tant que",t:"sel",o:["Artiste","Manager d'artiste"]},{k:"id_projet",l:"Projet présenté",h:"Ex. : sortie d'un EP, d'un album, d'une tournée..."}]} ]},
 { id:"s0", n:"0", title:"Clarifier son projet artistique et professionnel",
   crit:"À l'oral : présentez brièvement les fondements de votre projet (genre, influences, objectifs). Chaque choix des parties 1 à 6 doit pouvoir s'y rattacher.",
   blocks:[ {h:"1 · Identité musicale", grid:2, fields:[{k:"s0_genre",l:"Genre et sous-genre précis"},{k:"s0_infl",l:"Influences majeures",t:"ta"},{k:"s0_mots",l:"Mots-clés descriptifs"},{k:"s0_langues",l:"Langues et autres éléments d'identité"}]},
            {h:"2 · Univers visuel", grid:3, fields:[{k:"s0_palette",l:"Palette de couleurs"},{k:"s0_typo",l:"Typographies principales"},{k:"s0_style",l:"Style photographique ou graphique",t:"ta"}]},
            {h:"3 · Stratégie de contenu", grid:3, fields:[{k:"s0_formats",l:"Formats récurrents (sur tous les réseaux)",t:"ta"},{k:"s0_ton",l:"Ton de communication"},{k:"s0_freq",l:"Fréquence de publication"}]},
            {h:"Objectifs professionnels", list:"objPro"},
            {fields:[{k:"s0_situation",l:"Situation actuelle",t:"ta",h:"Où en êtes-vous aujourd'hui : sorties, audience, concerts, équipe..."}]} ]},
 { id:"s1", n:"1", title:"Analyse comparative de la structure juridique et du statut professionnel", comp:"C1",
   crit:"Cr1.1 : au moins 2 formes juridiques et 2 statuts spécifiques aux artistes, analysés selon 3 critères (revenus artistiques, gestion des droits d'auteur, obligations sociales et fiscales). Cr1.2 : choix final justifié au regard de la sécurisation juridique et fiscale, en lien avec votre projet.",
   blocks:[ {h:"Formes juridiques", list:"formes"}, {h:"Statuts professionnels spécifiques aux artistes", list:"statuts"},
            {h:"Choix final et justification", grid:2, fields:[{k:"s1_structure",l:"Structure juridique choisie"},{k:"s1_statut",l:"Statut professionnel choisi"}]},
            {fields:[{k:"s1_jur",l:"En quoi ce choix sécurise juridiquement mon activité",t:"ta"},{k:"s1_fisc",l:"En quoi ce choix sécurise fiscalement et socialement mon activité",t:"ta"},{k:"s1_coh",l:"Cohérence avec mon projet artistique (et conditions d'évolution)",t:"ta"}]} ]},
 { id:"s2", n:"2", title:"Analyse d'un contrat musical et protection des intérêts de l'artiste", comp:"C2",
   crit:"Cr2.1 : au moins 1 contrat-type et au moins 4 clauses sensibles, dont au moins 1 sur la cession de droits et 1 sur la rémunération. Cr2.2 : engagements et risques sur les droits artistiques, financiers et moraux. Cr2.3 : au moins 2 ajustements argumentés. Cr2.4 : au moins 2 ressources juridiques dont la fiabilité est justifiée.",
   blocks:[ {h:"Contrat analysé", grid:2, fields:[{k:"s2_type",l:"Type de contrat analysé",h:"Distribution, licence, artiste, édition, management..."},{k:"s2_projet",l:"Projet artistique concerné"},{k:"s2_obj",l:"Objectif du contrat",t:"ta"},{k:"s2_ref",l:"Référence du contrat joint en annexe",t:"ta",h:"Origine, nombre de pages, date. Joignez le contrat en annexe."}]},
            {h:"Clauses sensibles", list:"clauses"}, {h:"Ajustements proposés", list:"ajust"}, {h:"Ressources juridiques mobilisées", list:"ressJur"} ]},
 { id:"s3", n:"3", title:"Pilotage de la gestion administrative et financière du projet musical", comp:"C3",
   crit:"Cr3.1 : outils justifiés couvrant la facturation, la gestion de trésorerie et la gestion des droits d'auteur et droits voisins. Cr3.2 : au moins 2 processus opérationnels, dont au moins 1 relatif à la gestion des droits. Cr3.3 : organigramme des prestataires, leur rôle et la justification de leur légitimité.",

/* ================== ÉTAT ================== */
const KEY = "muziforma_rs7398_dossier_v1";
let S = { f:{}, l:{} };
function blankRow(name){ const o={}; LISTS[name].fields.forEach(f=>o[f.k]=""); return o; }
function ensureLists(){ for (const n in LISTS){ if(!Array.isArray(S.l[n])) S.l[n]=[]; while(S.l[n].length<LISTS[n].min) S.l[n].push(blankRow(n)); } }
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const p=JSON.parse(r); if(p&&p.f&&p.l) S=p; } }catch(e){} ensureLists(); }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); setSaveState("Enregistré automatiquement dans ce navigateur."); }catch(e){ setSaveState("Enregistrement automatique indisponible ici : pensez à « Sauvegarder mes réponses »."); } },400); }
function setSaveState(t){ document.getElementById("saveState").textContent=t; }

/* ================== FORMULAIRE ================== */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fieldHTML(f, val, attrs){
  const h = f.h ? `<span class="h">${esc(f.h)}</span>` : "";
  let inp;
  if (f.t==="ta") inp = `<textarea ${attrs}>${esc(val)}</textarea>`;
  else if (f.t==="sel") inp = `<select ${attrs}><option value="">Choisir...</option>${f.o.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else inp = `<input type="text" value="${esc(val)}" ${attrs}>`;
  return `<label class="f">${esc(f.l)}${h}${inp}</label>`;
}
function listHTML(name){
  const L=LISTS[name], rows=S.l[name];
  let h=`<div class="listhead"><span class="count" data-count="${name}"></span><button class="b small" data-add="${name}">+ Ajouter : ${esc(L.label.toLowerCase())}</button></div><div style="margin-top:8px">`;
  rows.forEach((r,i)=>{
    const g = L.fields.length>=4 ? "grid2" : (L.fields.length===3?"grid3":"grid2");
    h+=`<div class="row"><div class="rh"><span>${esc(L.label)} n°${i+1}</span>${rows.length>1?`<button class="b small danger" data-del="${name}" data-i="${i}">Retirer</button>`:""}</div><div class="${g}">`;
    L.fields.forEach(f=>{ h+=fieldHTML(f, r[f.k], `data-l="${name}" data-i="${i}" data-k="${f.k}"`); });
    h+=`</div></div>`;
  });
  return h+`</div>`;
}
function renderForm(){
  const m=document.getElementById("form"); let h=`<div class="info"><b>Comment ça marche.</b> Complétez chaque partie avec <b>votre propre projet</b> et <b>vos propres choix</b> : vous devrez les défendre à l'oral devant le jury. La colonne de gauche vous indique si vous atteignez les minimums du référentiel. Vos réponses sont enregistrées automatiquement dans ce navigateur. Pour changer d'appareil, utilisez « Sauvegarder mes réponses ». Quand tout est prêt, cliquez sur « Valider et générer mon dossier ».</div>`;
  SECTIONS.forEach(s=>{
    h+=`<section class="panel" id="${s.id}"><h2>${s.n!==""?s.n+" · ":""}${esc(s.title)}</h2><div class="crit">${esc(s.crit)}</div>`;
    s.blocks.forEach(b=>{
      if(b.h) h+=`<h3>${esc(b.h)}</h3>`;
      if(b.fields){ h+=`<div class="${b.grid===3?"grid3":b.grid===2?"grid2":""}">`; b.fields.forEach(f=>h+=fieldHTML(f, S.f[f.k], `data-f="${f.k}"`)); h+=`</div>`; }
      if(b.list) h+=`<div data-list="${b.list}">${listHTML(b.list)}</div>`;
    });
    h+=`</section>`;
  });
  m.innerHTML=h; refresh();
}
function rerenderList(name){ document.querySelectorAll(`[data-list="${name}"]`).forEach(el=>el.innerHTML=listHTML(name)); refresh(); }
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.f){ S.f[t.dataset.f]=t.value; save(); refresh(); }
  else if(t.dataset.l){ S.l[t.dataset.l][+t.dataset.i][t.dataset.k]=t.value; save(); refresh(); }
});
document.addEventListener("change", e=>{ const t=e.target; if(t.tagName==="SELECT"){ t.dispatchEvent(new Event("input",{bubbles:true})); } });
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.add){ S.l[t.dataset.add].push(blankRow(t.dataset.add)); save(); rerenderList(t.dataset.add); }
  if(t.dataset.del){ const n=t.dataset.del; S.l[n].splice(+t.dataset.i,1); ensureLists(); save(); rerenderList(n); }
  if(t.dataset.go){ document.getElementById(t.dataset.go).scrollIntoView({behavior:"smooth"}); }
});

/* ================== CONTRÔLES ================== */
const filled = v => String(v||"").trim().length>0;
const rowFilled = (name,r) => LISTS[name].fields.filter(f=>f.t!=="sel").slice(0,2).every(f=>filled(r[f.k])) || LISTS[name].fields.every(f=>f.t==="sel"?true:filled(r[f.k]));
function nFilled(name){ return S.l[name].filter(r=>rowFilled(name,r)).length; }
function has(name,k,v){ return S.l[name].some(r=>rowFilled(name,r)&&r[k]===v); }
function domainsCovered(){ const d=new Set(); S.l.sources.forEach(r=>{ if(rowFilled("sources",r)){ const x=r.dom||""; if(x.includes("Artistique"))d.add("A"); if(x.includes("Technologique"))d.add("T"); if(x.includes("Réglementaire"))d.add("R"); } }); return d.size; }
function platformsCount(){ const set=new Set(); S.l.planning.forEach(r=>String(r.plateformes||"").split(/[,;\/+]| et /).map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(x=>set.add(x))); return set.size; }

  ];
}
function refresh(){
  const cs=checks();
  document.getElementById("checks").innerHTML=cs.map(c=>`<div class="chk ${c.ok?"ok":"no"}"><span class="i">${c.ok?"✓":"○"}</span><span class="c"><b>${c.c}</b> ${esc(c.t)}</span></div>`).join("");
  document.getElementById("nav").innerHTML=SECTIONS.map(s=>{ const mine=cs.filter(c=>c.s===s.id); const ok=mine.filter(c=>c.ok).length; const st=mine.length?`<span class="st" style="color:${ok===mine.length?"var(--ok)":"var(--muted)"}">${ok}/${mine.length}</span>`:""; return `<button class="navitem" data-go="${s.id}">${s.n!==""?s.n+" · ":""}${esc(s.title.length>34?s.title.slice(0,32)+"…":s.title)}${st}</button>`; }).join("");
  document.querySelectorAll("[data-count]").forEach(el=>{ const n=el.dataset.count, k=nFilled(n), m=LISTS[n].min; el.className="count "+(k>=m?"ok":"no"); el.textContent=`${k} complété(s) · minimum ${m}`; });
}

let BLANK=false;

function rowsOf(name){ const r=S.l[name].filter(x=>BLANK||rowFilled(name,x)); return r.length?r:(BLANK?S.l[name]:[]); }
function tableOf(name, cols, opts){
  opts=opts||{}; const rows=rowsOf(name); const L=LISTS[name];
  const fs=cols.map(k=>L.fields.find(f=>f.k===k));
  let h=`<table><tr>${opts.num?'<th style="width:4%">N°</th>':""}${fs.map((f,i)=>`<th${opts.w&&opts.w[i]?` style="width:${opts.w[i]}"`:""}>${esc(f.l)}</th>`).join("")}</tr>`;
  if(!rows.length) h+=`<tr><td colspan="${fs.length+(opts.num?1:0)}"><span class="blank">Non renseigné</span></td></tr>`;
  rows.forEach((r,i)=>{ h+=`<tr>${opts.num?`<td>${i+1}</td>`:""}${fs.map(f=>`<td>${v(r[f.k], f.t==="ta"?3:1)}</td>`).join("")}</tr>`; });

}

  rowsOf("personas").forEach((r,i)=>{ h+=`<div class="card"><h4>Persona ${i+1}${filled(r.nom)?" · "+esc(r.nom):""}</h4><div class="kv"><b>Âge :</b> ${v(r.age)}</div><div class="kv"><b>Profil, CSP, métier :</b> ${v(r.csp)}</div><div class="kv"><b>Lieu :</b> ${v(r.lieu)}</div><div class="kv"><b>Loisirs :</b> ${v(r.loisirs)}</div><div class="kv"><b>Genres musicaux :</b> ${v(r.genre)}</div><div class="kv"><b>Plateformes :</b> ${v(r.plateformes)}</div><div class="kv"><b>Habitudes :</b> ${v(r.desc,2)}</div></div>`; });
  h+=`</div><h3>Indicateurs clés de performance</h3>${tableOf("kpis",["kpi","plateforme","obj","cible"])}</div>`;
  h+=`<div class="pg"><h2><span class="num">4</span>Planning éditorial et publicitaire sur 30 jours</h2>${crit("Cr4.3 : calendrier organisé par plateformes (au moins 2), formats et objectifs, sur au moins 1 mois, avec un budget déterminé et justifié.")}
   <p><b>Période :</b> ${v(f.s4_periode)}</p>
   ${tableOf("planning",["periode","plateformes","actions","obj","budget"],{w:["13%","15%","","15%","11%"]})}
   <div class="choice"><b>Budget et justification :</b> ${v(f.s4_budget,3)}</div></div>`;
  // 5
  h+=`<div class="pg"><h2><span class="num">5</span>Exploitation et analyse de la campagne</h2>${crit(sec("s5").crit)}
   <table><tr><th style="width:16%">Régie publicitaire</th><th>Fonctionnalités exploitées</th><th style="width:22%">Type et format de campagne</th><th style="width:24%">Indicateurs mesurés et outils</th></tr><tr><td>${v(f.s5_regie)}</td><td>${v(f.s5_fonct,3)}</td><td>${v(f.s5_type,2)}</td><td>${v(f.s5_kpi,2)}</td></tr></table>
   <p><b>Pourquoi ce type de campagne :</b> ${v(f.s5_pourquoi,2)}</p>
   ${filled(f.s5_fictif)?`<p><b>Nature de la campagne :</b> ${esc(f.s5_fictif)}</p>`:""}
   <h3>Résultats et optimisations</h3>${tableOf("result",["res","optim","justif"],{w:["32%","32%"]})}
   <h2 style="margin-top:16px"><span class="num">5</span>Contenu inclusif et éco-responsable</h2>
   ${tableOf("contenus",["type","access","sobr","justif"],{w:["16%","28%","25%"]})}</div>`;
  // 6
  h+=`<div class="pg"><h2><span class="num">6</span>${esc(sec("s6").title)}</h2>${crit(sec("s6").crit)}
   ${tableOf("sources",["nom","secteur","fiab","dom"],{w:["18%","22%","","18%"]})}
   <h3>Outils de veille automatisée et paramétrage</h3>${tableOf("outVeille",["outil","param","justif"],{w:["16%","","30%"]})}
   <h3>Signaux faibles, opportunités et impact sur ma stratégie</h3>${tableOf("signaux",["type","element","impact"],{w:["14%","40%"]})}</div>`;
  // annexes
  if(filled(f.annexes)||BLANK) h+=`<div class="pg"><h2>Annexes</h2><div class="kv">${v(f.annexes,8)}</div></div>`;
  document.getElementById("doc").innerHTML=h;
}

/* ================== ACTIONS ================== */
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),3200); }
function modal(title, body, acts){ document.getElementById("mTitle").textContent=title; document.getElementById("mBody").innerHTML=body; const a=document.getElementById("mActs"); a.innerHTML=""; acts.forEach(x=>{ const b=document.createElement("button"); b.className="b"+(x.primary?" primary":"")+(x.danger?" danger":""); b.textContent=x.l; b.onclick=()=>{ document.getElementById("modal").classList.remove("on"); x.fn&&x.fn(); }; a.appendChild(b); }); document.getElementById("modal").classList.add("on"); }
function showPreview(){
  BLANK=false; renderDoc();
  const miss=checks().filter(c=>!c.ok);
  document.getElementById("missing").innerHTML = miss.length ? `<div class="missing"><b>${miss.length} exigence(s) du référentiel ne sont pas encore atteintes.</b> Vous pouvez générer le dossier, mais complétez-les avant le dépôt :<ul>${miss.map(c=>`<li><b>${c.c}</b> · ${esc(c.t)}</li>`).join("")}</ul></div>` : `<div class="missing" style="background:#e8f6ee;border-color:#9bd3b2"><b>Toutes les exigences minimales sont atteintes.</b> Relisez votre dossier : chaque choix doit être justifié et vous devez pouvoir le défendre à l'oral.</div>`;
  document.getElementById("formView").style.display="none"; document.querySelector("header.top").style.display="none";
  document.getElementById("previewWrap").classList.add("on"); window.scrollTo(0,0);
}
document.getElementById("btnValider").onclick=showPreview;
document.getElementById("btnBack").onclick=()=>{ document.getElementById("previewWrap").classList.remove("on"); document.getElementById("formView").style.display=""; document.querySelector("header.top").style.display=""; };
function fname(ext){ const n=[S.f.id_nom,S.f.id_prenom].filter(filled).join("_").replace(/[^\wÀ-ÿ-]+/g,"_"); return `Dossier_RS7398_${n||"candidat"}.${ext}`; }
let DL=null; (async()=>{ try{ if(window.claude&&claude.use) DL=await claude.use("downloads"); }catch(e){ DL=null; } })();
async function offer(filename, data){
  if(!DL){ try{ if(window.claude&&claude.use) DL=await claude.use("downloads"); }catch(e){} }
  if(!DL){
    try{
      const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".json")?"application/json":filename.endsWith(".html")?"text/html":"application/octet-stream"});
      const url = URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("Fichier téléchargé."); return true;
    }catch(e){ toast("Le téléchargement n'est pas disponible dans cette vue."); return false; }
  }
  try{ await DL.save({filename, data}); toast("Fichier prêt."); return true; }
  catch(err){ const c=err&&err.code; if(c==="declined") toast("Téléchargement annulé."); else if(c==="rate_limited") toast("Une demande est déjà ouverte, réessayez dans un instant."); else toast("Téléchargement impossible ici."); return false; }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
document.getElementById("btnPdf").onclick=async()=>{
  const btn=document.getElementById("btnPdf"); btn.disabled=true; btn.textContent="Génération du PDF...";
  try{
    if(!window.html2pdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js");
    const el=document.getElementById("doc"); el.classList.add("exporting");
    const opt={ margin:[8,8,8,8], image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"}, jsPDF:{unit:"mm",format:"a4",orientation:"landscape"}, pagebreak:{mode:["css","legacy"], avoid:["tr",".card",".choice"]} };
    const blob=await html2pdf().set(opt).from(el).outputPdf("blob");
    el.classList.remove("exporting");
    await offer(fname("pdf"), blob);
  }catch(e){ toast("La génération du PDF a échoué. Essayez « Télécharger en HTML » puis imprimez en PDF."); }
  btn.disabled=false; btn.textContent="Télécharger le PDF";
};
function standaloneHTML(){ const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n"); return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${esc(fname("pdf").replace(".pdf",""))}</title><style>${css}\nbody{background:#fff}.doc .pg{border:0}@media print{.doc .pg{margin:0;padding:0;min-height:0}}</style></head><body><div class="doc">${document.getElementById("doc").innerHTML}</div></body></html>`; }
document.getElementById("btnHtml").onclick=()=>offer(fname("html"), standaloneHTML());
document.getElementById("btnExport").onclick=()=>offer(fname("json").replace("Dossier_","Sauvegarde_"), JSON.stringify(S,null,1));
document.getElementById("btnImport").onclick=()=>document.getElementById("fileImport").click();
document.getElementById("fileImport").onchange=e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p.f||!p.l) throw 0; S=p; ensureLists(); save(); renderForm(); toast("Sauvegarde reprise."); }catch(err){ toast("Ce fichier n'est pas une sauvegarde valide."); } }; r.readAsText(file); e.target.value=""; };
document.getElementById("btnReset").onclick=()=>modal("Tout effacer ?","<p>Toutes vos réponses seront supprimées de ce navigateur. Pensez à sauvegarder avant si besoin.</p>",[{l:"Annuler"},{l:"Tout effacer",danger:true,fn:()=>{ S={f:{},l:{}}; ensureLists(); try{localStorage.removeItem(KEY);}catch(e){} renderForm(); toast("Réponses effacées."); }}]);

/* ================== DÉMARRAGE ================== */
load();
if(location.hash==="#modele-vide"){ document.body.classList.add("printmode"); BLANK=true; S={f:{},l:{}}; for(const n in LISTS){ S.l[n]=[]; const k=Math.max(LISTS[n].min, n==="planning"?4:0); for(let i=0;i<k;i++) S.l[n].push(blankRow(n)); } renderDoc(); }
else renderForm();
</script>
